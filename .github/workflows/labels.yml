name: Labels

on:
  push:
    branches: [main]
    paths: [".github/labels.yml", ".github/workflows/labels.yml"]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: 라벨 만들기·고치기 (.github/labels.yml)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY' > /tmp/labels.tsv
          import yaml
          for l in yaml.safe_load(open(".github/labels.yml", encoding="utf-8")):
              print(f"{l['name']}\t{l['color']}\t{l.get('description','')}")
          PY
          while IFS=$'\t' read -r name color desc; do
            gh label create "$name" --color "$color" --description "$desc" --force
          done < /tmp/labels.tsv
          gh label list
