; herb-dryer 펌웨어 (ESP32 DevKitC V4, WROOM-32D)
; 빌드: pio run        업로드: pio run -t upload        시리얼: pio device monitor
;
; 버전은 전부 고정한다 (팀원 모두 같은 코어·라이브러리로 빌드).
;   espressif32 6.13.0 → Arduino-ESP32 코어 2.0.17 (ESP-IDF 4.4 기반)
;   LEDC는 2.x 문법: ledcSetup(ch, freq, bits) + ledcAttachPin(pin, ch) + ledcWrite(ch, duty)
;   (3.x의 ledcAttach(pin, freq, bits) / ledcWrite(pin, duty)는 이 코어에서 컴파일되지 않는다)
;   코어 3.x로 올리려면 espressif32 8.x — 팀 합의 후 이 줄과 LEDC 코드를 같은 PR에서 바꾼다.
[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -Wall

; Wire·SPI·SD는 코어 내장이라 넣지 않는다. TCS34725는 v3.1에서 삭제되어 넣지 않는다.
lib_deps =
    adafruit/Adafruit SHT31 Library@2.2.2
    adafruit/Adafruit BME680 Library@2.0.6        ; BME688용 (BME680 호환, 가스 히터 프로파일은 기본 기능만)
    bogde/HX711@0.7.5
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    ; 위 라이브러리의 의존성도 고정
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
