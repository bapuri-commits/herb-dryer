  SD:      {value: [42, 24, 8],  status: 가정, source: "마이크로SD 모듈 일반 크기 (BOM 22)"}
  HX711:   {value: [34, 20, 6],  status: 가정, source: "HX711 일반 크기 (BOM 6, 구매완료 11/7)"}
