  L:        {value: 25,   status: 가정, source: "25mm 경첩"}
  leaf:     {value: 12,   status: 가정, source: "날개 폭 ~12 (BOM 규격)"}
  t:        {value: 1.0,  status: 가정, source: "판 두께 가정"}
  pin_x:    {value: -2.0, status: 가정, source: "핀 중심 x (앞판 왼쪽 모서리 밖)"}
